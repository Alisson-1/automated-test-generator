version: '3.9'

services:
  backend:
    build:
      context: ./backend
      target: development
    volumes:
      - ./backend/src:/app/src
      - ./backend/data:/app/data
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: development
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:3001
    depends_on:
      - backend
    restart: unless-stopped
